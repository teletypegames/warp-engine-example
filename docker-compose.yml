# Example stack: everything WarpEngine needs to come alive, end to end.
#
#   mysql             the catalog database
#   app               a Rails host with the warp_engine gem from the TTG gem registry,
#                     ActiveAdmin + Devise for the admin at /admin
#   shelf-http        the C64 and Plus/4 shelves over plain HTTP (WARP64U), port 8090
#   shelf-ftp         the shelves over FTP (DOSINST), port 2121
#
# The git server (Gitea) and the CI (Woodpecker) are not services here: the
# engine starts and wires them itself through the Docker socket (WarpEngine 5.5
# local components, warp-example-gitea / warp-example-woodpecker*).
#
# Everything, wired up (forge, CI, tokens, admin users):
#   bin/setup
#
# Only the catalog and the admin:
#   cp .env.example .env
#   docker compose up -d --build
#
# Against an engine checkout instead of the released gem:
#   WARP_ENGINE_SOURCE=../warp_engine docker compose -f docker-compose.yml -f compose.engine.yml up -d --build

services:
  mysql:
    image: mysql:8
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-warpengine}
      MYSQL_DATABASE: warp_engine_example
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: ./host_app
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      RAILS_ENV: development
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-warpengine}
      SITE_URL: http://localhost:${APP_PORT:-8080}
      FORKS_ALLOW_PRIVATE_ENGINES: ${FORKS_ALLOW_PRIVATE_ENGINES:-0}
      STORE_NAME: ${STORE_NAME:-My Studio}
      SHELF_HTTP_URL: ${SHELF_HTTP_URL:-http://localhost:8090}
      SHELF_FTP_URL: ${SHELF_FTP_URL:-ftp://localhost:2121}
      UPDATE_SECRET: ${UPDATE_SECRET:-example-update-secret}
      FILE_CONTAINER_PATH: /softwares
      IMAGE_CONTAINER_PATH: /images
      GITEA_PORT: ${GITEA_PORT:-3000}
      WOODPECKER_PORT: ${WOODPECKER_PORT:-8000}
      WARP_ENGINE_VERSION: ${WARP_ENGINE_VERSION:-~> 5.5}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./host_app:/app
      - bundle:/usr/local/bundle
      - softwares:/softwares
      - images:/images
      - /var/run/docker.sock:/var/run/docker.sock

  # The shelves (C64, Plus/4, DOS) the engine writes, for the clients that read files
  # rather than the API: WARP64U on a C64 over plain HTTP, DOSINST on DOS over FTP.
  shelf-http:
    build:
      context: ./shelves
      dockerfile: http.Dockerfile
    ports:
      - "${SHELF_HTTP_PORT:-8090}:8080"
    volumes:
      - softwares:/softwares:ro

  shelf-ftp:
    build:
      context: ./shelves
      dockerfile: ftp.Dockerfile
    ports:
      - "${SHELF_FTP_PORT:-2121}:2121"
      - "30000-30009:30000-30009"
    environment:
      FTP_MASQUERADE: ${SHELF_FTP_ADDRESS:-127.0.0.1}
    volumes:
      - softwares:/softwares:ro

networks:
  default:
    name: warp-example

volumes:
  mysql-data:
  bundle:
  softwares:
  images:
